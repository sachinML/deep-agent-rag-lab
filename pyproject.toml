[project]
name = "deep-agent-rag-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7,<1",
    "deepeval>=4.3.4",
    "docling>=2.151.1",
    "elasticsearch>=9,<10",
    "langchain>=1,<2",
    "langchain-google-genai>=3",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1,<2",
    "ollama>=0.6.3",
    "pytest>=8,<10",
    "python-dotenv>=1,<2",
    "sentence-transformers>=6.3.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent_rag"]