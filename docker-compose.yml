# This configuration creates a persistent Elasticsearch data volume, so stopping the container won't delete your indexes.
# Security is disabled only for this local development experiment, and the port is bound to localhost.
# Don't expose this configuration publicly. Elastic documents single-node Docker deployment for local testing.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: rag-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: rag-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
